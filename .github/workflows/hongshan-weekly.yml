name: HongShan Weekly Report

on:
  # 每周一早上8点 CST (UTC+8) = 0:00 UTC
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  run-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas

      - name: Ensure output directory
        run: mkdir -p output

      - name: Download sent_records from previous run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/output/sent_records.json" \
            | python3 -c "
import sys,json,base64
content=json.load(sys.stdin)
if 'content' in content:
    with open('output/sent_records.json','w') as f:
        f.write(base64.b64decode(content['content']).decode())
    print('sent_records.json 已下载')
else:
    print('sent_records.json 不存在，使用空文件')
" || echo '下载失败，使用空文件'

      - name: Run weekly report
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: system@cardatatool.com
          EMAIL_TO: rzwei@che300.com
          EMAIL_CC: tshu@che300.com
        run: |
          cd scripts
          python main.py weekly

      - name: Upload sent_records as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sent-records-${{ github.run_number }}
          path: output/sent_records.json

      - name: Commit sent_records to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add output/sent_records.json output/company_detail_cache.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update sent_records [weekly] $(date +%Y%m%d)" && git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git main)

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_number }}
          path: output/
